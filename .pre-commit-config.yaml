repos:
  - repo: local
    # One hook per `static` member, and each hook's id is the recipe it runs, so
    # `SKIP=<id>` and `prek run <id>` name the same gate `just <id>` does.
    hooks:
      - id: lint
        name: Ruff lint
        entry: just lint
        language: system
        pass_filenames: false
      - id: format-check
        name: Ruff format check
        entry: just format-check
        language: system
        pass_filenames: false
      - id: typecheck
        name: ty type check
        entry: just typecheck
        language: system
        pass_filenames: false
      - id: secrets
        name: Detect secrets
        entry: just secrets
        language: system
        pass_filenames: false
      - id: workflow-security
        name: Audit GitHub Actions
        entry: just workflow-security
        language: system
        pass_filenames: false
      - id: env-vars
        name: Env-var documentation guard
        entry: just env-vars
        language: system
        pass_filenames: false
      - id: nicknames
        name: Nicknames guard
        entry: just nicknames
        language: system
        pass_filenames: false
      - id: test-layout
        name: Test layout guard
        entry: just test-layout
        language: system
        pass_filenames: false
      - id: capability-inventory
        name: Capability inventory guard
        entry: just capability-inventory
        language: system
        pass_filenames: false
      - id: tool-docs-check
        name: Generated tool reference guard
        entry: just tool-docs-check
        language: system
        pass_filenames: false
      - id: adr-numbering
        name: ADR numbering guard
        entry: just adr-numbering
        language: system
        pass_filenames: false
      - id: doc-freshness
        name: Generated documentation guard
        entry: just doc-freshness
        language: system
        pass_filenames: false
      - id: doc-links
        name: Relative Markdown link guard
        entry: just doc-links
        language: system
        pass_filenames: false
      - id: live-vocabulary
        name: Live vocabulary guard
        entry: just live-vocabulary
        language: system
        pass_filenames: false
      - id: scenario-gap
        name: Scenario gap guard
        entry: just scenario-gap
        language: system
        pass_filenames: false
