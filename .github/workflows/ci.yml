name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.architecture }} / Python ${{ matrix.python-version }} / verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.11"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.12"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.13"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # hatch-vcs derives the package version from tags and history (ADR 0250).
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.10"
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: "1.58.0"
      - name: Set up development environment
        run: just setup
      # Each static gate has its own named hook and failure diagnostics (ADR 0207).
      - name: Run static gates through hooks
        run: UV_NO_SYNC=1 uv run --no-sync prek run --all-files
      - name: Prepare bounded Python 3.12 timing observation
        if: matrix.python-version == '3.12'
        run: |
          umask 077
          observer_dir="$RUNNER_TEMP/q1775-ci-observer"
          mkdir "$observer_dir"
          mkdir "$observer_dir/events"
          cat > "$observer_dir/q1775_ci_observer.py" <<'PY'
          """Temporary #1775 observation only; remove with the diagnostic workflow commit."""

          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import resource
          import sys
          import time

          import pytest

          _LIMIT = 16 * 1024 * 1024
          _WRITE, _CLOSE = os.write, os.close
          _NOW, _CPU, _USAGE = time.monotonic, time.process_time, resource.getrusage
          _DUMPS, _HASH, _MATCH = json.dumps, hashlib.sha256, re.fullmatch
          _STDERR = sys.__stderr__
          _SELF = resource.RUSAGE_SELF


          def _number(value):
              return round(value, 6) if isinstance(value, (int, float)) and math.isfinite(value) else None


          class Observer:
              def __init__(self, directory, role):
                  self.role = role
                  self.current = None
                  self.sequence = 0
                  self.written = 0
                  self.fd = os.open(
                      directory / "events" / (role + ".jsonl"),
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_APPEND | os.O_NOFOLLOW,
                      0o600,
                  )
                  affinity = len(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else None
                  self.emit([
                      "init", role, _NOW(), list(sys.version_info[:3]), sys.platform,
                      os.cpu_count(), affinity, list(os.getloadavg()),
                      "maxrss-KiB" if sys.platform == "linux" else "maxrss-bytes",
                  ])

              def emit(self, row):
                  if self.fd is None:
                      return
                  data = (_DUMPS(row, separators=(",", ":"), ensure_ascii=True) + "\n").encode()
                  if len(data) > 2048 or self.written + len(data) > _LIMIT - 256:
                      data = (_DUMPS(["cap", _NOW(), self.written]) + "\n").encode()
                      final = True
                  else:
                      final = False
                  try:
                      if _WRITE(self.fd, data) != len(data):
                          raise OSError("short observer write")
                      self.written += len(data)
                  except OSError:
                      _STDERR.write("q1775 observation unavailable: bounded event write failed\n")
                      final = True
                  if final:
                      _CLOSE(self.fd)
                      self.fd = None

              @pytest.hookimpl(optionalhook=True)
              def pytest_configure_node(self, node):
                  if self.role == "controller":
                      node.workerinput["q1775_observation"] = True

              def pytest_runtest_logstart(self, nodeid, location):
                  if self.role == "controller":
                      return
                  self.sequence += 1
                  self.current = (nodeid, self.sequence)
                  name = nodeid.split("[", 1)[0]
                  if (
                      len(name) > 240
                      or "/../" in name
                      or not _MATCH(r"tests/[A-Za-z0-9_./-]+\.py(?:::[A-Za-z0-9_]+)*", name)
                  ):
                      name = "unmapped"
                  self.emit(["s", self.sequence, _NOW(), _HASH(nodeid.encode()).hexdigest(), name, _CPU()])

              def pytest_runtest_logreport(self, report):
                  if self.role == "controller" or self.current is None:
                      return
                  if report.nodeid != self.current[0]:
                      self.emit(["unexpected-report", _NOW()])
                      return
                  phase = {"setup": 0, "call": 1, "teardown": 2}.get(report.when)
                  outcome = {"passed": 0, "failed": 1, "skipped": 2}.get(report.outcome)
                  usage = _USAGE(_SELF)
                  self.emit([
                      "p", self.current[1], _NOW(), phase, _number(report.duration),
                      outcome, _CPU(), usage.ru_maxrss,
                  ])

              def pytest_runtest_logfinish(self, nodeid, location):
                  if self.role != "controller" and self.current is not None:
                      self.emit(["f", self.current[1], _NOW(), _CPU()])
                      self.current = None

              def pytest_sessionfinish(self, session, exitstatus):
                  self.emit(["end", _NOW(), int(exitstatus), _CPU()])

              def pytest_unconfigure(self, config):
                  if self.fd is not None:
                      _CLOSE(self.fd)
                      self.fd = None


          def pytest_configure(config):
              directory_text = os.environ.get("Q1775_OBSERVER_DIR")
              root_text = os.environ.get("Q1775_OBSERVER_ROOT")
              if not directory_text or not root_text or config.rootpath.resolve() != Path(root_text).resolve():
                  return
              directory = Path(directory_text)
              if directory.is_symlink() or not directory.is_dir():
                  raise pytest.UsageError("q1775 observation directory is invalid")
              worker = getattr(config, "workerinput", None)
              if worker is not None:
                  if worker.get("q1775_observation") is not True:
                      return
                  role = worker.get("workerid")
                  if role not in ("gw0", "gw1"):
                      raise pytest.UsageError("q1775 observation requires the unchanged two-worker policy")
              else:
                  try:
                      owner = os.open(
                          directory / "owner", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600
                      )
                  except FileExistsError:
                      return
                  os.close(owner)
                  role = "controller" if config.getoption("numprocesses", default=0) else "serial"
              config.pluginmanager.register(Observer(directory, role), "q1775-observation")
          PY
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path

          if os.environ.get("PYTEST_PLUGINS"):
              raise SystemExit("diagnostic requires no pre-existing explicit pytest plugins")
          directory = str(Path(os.environ["RUNNER_TEMP"]) / "q1775-ci-observer")
          prior = os.environ.get("PYTHONPATH")
          values = {
              "PYTEST_PLUGINS": "q1775_ci_observer",
              "PYTHONPATH": directory + (os.pathsep + prior if prior else ""),
              "Q1775_OBSERVER_DIR": directory,
              "Q1775_OBSERVER_ROOT": os.environ["GITHUB_WORKSPACE"],
          }
          if any("\n" in value or "\r" in value for value in values.values()):
              raise SystemExit("diagnostic environment value contains a line separator")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY
      - name: Run runtime verification suite
        run: just verify-runtime
      - name: Retain bounded Python 3.12 timing observation
        if: ${{ always() && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: q1775-python312-observation
          path: ${{ runner.temp }}/q1775-ci-observer/events/*.jsonl
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          include-hidden-files: false
      - name: Retain validated wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-wheel-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  library-wheel-smoke:
    needs: ci
    name: amd64 / Python 3.13 / library wheel smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out library smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.10"
      - name: Download validated wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-wheel-amd64-py3.13
          path: dist
      - name: Install bare validated wheel in a fresh environment
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )) || [[ ! -f "${wheels[0]:-}" ]]; then
            printf 'expected exactly one Python 3.13 wheel\n' >&2
            exit 1
          fi
          uv venv --python "3.13" .library-wheel-venv
          uv pip install --python .library-wheel-venv/bin/python \
            "${wheels[0]}"
      - name: Exercise the installed public API
        run: |
          .library-wheel-venv/bin/python - <<'PY'
          import asyncio
          from importlib.util import find_spec
          from pathlib import Path
          import sys

          from hmcpctl.operations.inventory.capacity import CapacitySummary, fetch_capacity_report

          package_path = Path(sys.modules["hmcpctl"].__file__).resolve()
          environment = Path(".library-wheel-venv").resolve()
          assert package_path.is_relative_to(environment), package_path
          assert find_spec("fastmcp") is None
          assert find_spec("mcp") is None
          assert find_spec("rich") is None
          assert find_spec("typer") is None
          assert (package_path.parent / "py.typed").is_file(), package_path

          SYSTEM = "00000000-0000-4000-8000-000000000001"

          class FakeHMC:
              async def list_system_summaries(self):
                  return [{"UUID": SYSTEM, "SystemName": "p10", "State": "operating"}]

              async def get_managed_system(self, uuid):
                  assert uuid == SYSTEM
                  return {
                      "UUID": SYSTEM,
                      "Resource": {
                          "SystemName": "p10",
                          "AssociatedSystemMemoryConfiguration": {
                              "ConfigurableSystemMemory": "32768",
                              "CurrentAvailableSystemMemory": "24576",
                          },
                          "AssociatedSystemProcessorConfiguration": {
                              "ConfigurableSystemProcessorUnits": "8",
                              "CurrentAvailableSystemProcessorUnits": "6",
                          },
                      },
                  }

              async def list_logical_partitions(self, system_uuid):
                  assert system_uuid == SYSTEM
                  return [{
                      "UUID": "lpar-1",
                      "Resource": {"PartitionState": "running"},
                  }]

          report = asyncio.run(fetch_capacity_report(FakeHMC()))
          assert report == [CapacitySummary(
              system_uuid=SYSTEM,
              system_name="p10",
              total_memory_mib=32768,
              assigned_memory_mib=8192,
              free_memory_mib=24576,
              total_proc_units=8.0,
              assigned_proc_units=2.0,
              free_proc_units=6.0,
              total_lpars=1,
              running_lpars=1,
          )]
          PY
      - name: Prove the marker makes the installed facade readable to a checker
        run: |
          cat > consumer_probe.py <<'PY'
          from hmcpctl.api import HMCConfig


          def probe(config: HMCConfig) -> object:
              return config.field_that_does_not_exist
          PY
          # mypy is the checker that enforces PEP 561 as written: without a
          # readable py.typed it refuses the import outright ([import-untyped])
          # rather than reading the annotations anyway, which is what makes this
          # a real gate. The repo's own ty does read them regardless, so it
          # cannot tell a marked distribution from an unmarked one.
          #
          # Asserting "no diagnostics" would pass vacuously against an untyped
          # package, so assert the diagnostic that only a resolved type
          # produces, and reject the one that means the marker was not read.
          uv run --no-project --with "mypy==2.3.1" mypy \
            --python-executable .library-wheel-venv/bin/python \
            --no-incremental consumer_probe.py > probe.txt 2>&1 || true
          cat probe.txt
          if grep -q 'import-untyped' probe.txt; then
            printf 'installed distribution is missing a readable py.typed\n' >&2
            exit 1
          fi
          if ! grep -q 'attr-defined' probe.txt; then
            printf 'installed facade did not resolve as a typed package\n' >&2
            exit 1
          fi

  library-range-floors:
    needs: ci
    name: amd64 / Python 3.13 / library range floors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.12.10"
      - name: Download validated wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-wheel-amd64-py3.13
          path: dist
      - name: Derive every declared range's floor from pyproject.toml
        run: |
          uv run --no-project python - <<'PY'
          import re
          import tomllib

          with open("pyproject.toml", "rb") as file:
              dependencies = tomllib.load(file)["project"]["dependencies"]

          requirement = re.compile(
              r"^(?P<name>[A-Za-z0-9][A-Za-z0-9._-]*)"
              r">=(?P<floor>[A-Za-z0-9][A-Za-z0-9.!+_-]*),"
              r"<(?P<cap>[A-Za-z0-9][A-Za-z0-9.!+_-]*)$"
          )
          with open(".range-floors.txt", "w") as out:
              for spec in dependencies:
                  match = requirement.fullmatch(spec)
                  if match is None:
                      raise SystemExit(
                          f"runtime dependency has no testable floor: {spec}"
                      )
                  out.write(f"{match['name']}=={match['floor']}\n")
          PY
          cat .range-floors.txt
      - name: Install the wheel with every runtime dependency at its floor
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )) || [[ ! -f "${wheels[0]:-}" ]]; then
            printf 'expected exactly one Python 3.13 wheel\n' >&2
            exit 1
          fi
          uv venv --python "3.13" .floor-venv
          uv pip install --python .floor-venv/bin/python \
            --requirements .range-floors.txt \
            "${wheels[0]}"
      - name: Exercise the installed public API on the floors
        run: |
          .floor-venv/bin/python - <<'PY'
          import asyncio
          from importlib.util import find_spec
          from pathlib import Path
          import sys

          from hmcpctl.operations.inventory.capacity import CapacitySummary, fetch_capacity_report

          package_path = Path(sys.modules["hmcpctl"].__file__).resolve()
          environment = Path(".floor-venv").resolve()
          assert package_path.is_relative_to(environment), package_path
          assert find_spec("fastmcp") is None
          assert find_spec("mcp") is None
          assert find_spec("rich") is None
          assert find_spec("typer") is None

          SYSTEM = "00000000-0000-4000-8000-000000000001"

          class FakeHMC:
              async def list_system_summaries(self):
                  return [{"UUID": SYSTEM, "SystemName": "p10", "State": "operating"}]

              async def get_managed_system(self, uuid):
                  assert uuid == SYSTEM
                  return {
                      "UUID": SYSTEM,
                      "Resource": {
                          "SystemName": "p10",
                          "AssociatedSystemMemoryConfiguration": {
                              "ConfigurableSystemMemory": "32768",
                              "CurrentAvailableSystemMemory": "24576",
                          },
                          "AssociatedSystemProcessorConfiguration": {
                              "ConfigurableSystemProcessorUnits": "8",
                              "CurrentAvailableSystemProcessorUnits": "6",
                          },
                      },
                  }

              async def list_logical_partitions(self, system_uuid):
                  assert system_uuid == SYSTEM
                  return [{
                      "UUID": "lpar-1",
                      "Resource": {"PartitionState": "running"},
                  }]

          report = asyncio.run(fetch_capacity_report(FakeHMC()))
          assert report == [CapacitySummary(
              system_uuid=SYSTEM,
              system_name="p10",
              total_memory_mib=32768,
              assigned_memory_mib=8192,
              free_memory_mib=24576,
              total_proc_units=8.0,
              assigned_proc_units=2.0,
              free_proc_units=6.0,
              total_lpars=1,
              running_lpars=1,
          )]
          PY

  wheel-smoke:
    needs: ci
    name: ${{ matrix.architecture }} / Python ${{ matrix.python-version }} / wheel smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.11"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.12"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.13"
          - architecture: amd64
            runner: ubuntu-24.04
            python-version: "3.14"
    steps:
      - name: Check out smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.10"
      - name: Download validated wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-wheel-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: dist
      - name: Show the wheel's derived version
        run: ls -l dist
      - name: Exercise library and app installations
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv run --no-project python scripts/smoke_release_wheel.py dist

