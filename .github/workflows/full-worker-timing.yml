# Temporary worker diagnosis; never merge this workflow.
name: Full worker timing
on:
  push:
    branches: [diag/full-worker-timing-1823]
permissions:
  contents: read
concurrency:
  group: full-worker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    name: ${{ matrix.label }} / full worker timing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: py312-system
            python: "3.12"
            provider: system
          - label: py313-managed
            python: "3.13"
            provider: managed
    env:
      UV_PYTHON_PREFERENCE: ${{ matrix.provider == 'managed' && 'only-managed' || 'only-system' }}
      UV_PYTHON: ${{ matrix.provider == 'system' && '/usr/bin/python3.12' || matrix.python }}
      EXPECTED_PROVIDER: ${{ matrix.provider }}
    steps:
      - name: Check out fixed diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install existing pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
          version: "0.12.10"
      - name: Install existing pinned just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4
        with:
          just-version: "1.58.0"
      - name: Bootstrap locked environment
        run: just setup
      - name: Prepare unchanged validated observer and provenance
        run: |
          umask 077
          base="$RUNNER_TEMP/n1-focused"
          mkdir -p "$base/events"
          cat > "$base/q1775_ci_observer.py" <<'PYOBSERVER'
          """Temporary #1775 observation only; remove with the diagnostic workflow commit."""

          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import resource
          import sys
          import time

          import pytest

          _LIMIT = 16 * 1024 * 1024
          _WRITE, _CLOSE = os.write, os.close
          _NOW, _CPU, _USAGE = time.monotonic, time.process_time, resource.getrusage
          _DUMPS, _HASH, _MATCH = json.dumps, hashlib.sha256, re.fullmatch
          _STDERR = sys.__stderr__
          _SELF = resource.RUSAGE_SELF


          def _number(value):
              return round(value, 6) if isinstance(value, (int, float)) and math.isfinite(value) else None


          class Observer:
              def __init__(self, directory, role):
                  self.role = role
                  self.current = None
                  self.sequence = 0
                  self.written = 0
                  self.fd = os.open(
                      directory / "events" / (role + ".jsonl"),
                      os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_APPEND | os.O_NOFOLLOW,
                      0o600,
                  )
                  affinity = len(os.sched_getaffinity(0)) if hasattr(os, "sched_getaffinity") else None
                  self.emit([
                      "init", role, _NOW(), list(sys.version_info[:3]), sys.platform,
                      os.cpu_count(), affinity, list(os.getloadavg()),
                      "maxrss-KiB" if sys.platform == "linux" else "maxrss-bytes",
                  ])

              def emit(self, row):
                  if self.fd is None:
                      return
                  data = (_DUMPS(row, separators=(",", ":"), ensure_ascii=True) + "\n").encode()
                  if len(data) > 2048 or self.written + len(data) > _LIMIT - 256:
                      data = (_DUMPS(["cap", _NOW(), self.written]) + "\n").encode()
                      final = True
                  else:
                      final = False
                  try:
                      if _WRITE(self.fd, data) != len(data):
                          raise OSError("short observer write")
                      self.written += len(data)
                  except OSError:
                      _STDERR.write("q1775 observation unavailable: bounded event write failed\n")
                      final = True
                  if final:
                      _CLOSE(self.fd)
                      self.fd = None

              @pytest.hookimpl(optionalhook=True)
              def pytest_configure_node(self, node):
                  if self.role == "controller":
                      node.workerinput["q1775_observation"] = True

              def pytest_runtest_logstart(self, nodeid, location):
                  if self.role == "controller":
                      return
                  self.sequence += 1
                  self.current = (nodeid, self.sequence)
                  name = nodeid.split("[", 1)[0]
                  if (
                      len(name) > 240
                      or "/../" in name
                      or not _MATCH(r"tests/[A-Za-z0-9_./-]+\.py(?:::[A-Za-z0-9_]+)*", name)
                  ):
                      name = "unmapped"
                  self.emit(["s", self.sequence, _NOW(), _HASH(nodeid.encode()).hexdigest(), name, _CPU()])

              def pytest_runtest_logreport(self, report):
                  if self.role == "controller" or self.current is None:
                      return
                  if report.nodeid != self.current[0]:
                      self.emit(["unexpected-report", _NOW()])
                      return
                  phase = {"setup": 0, "call": 1, "teardown": 2}.get(report.when)
                  outcome = {"passed": 0, "failed": 1, "skipped": 2}.get(report.outcome)
                  usage = _USAGE(_SELF)
                  self.emit([
                      "p", self.current[1], _NOW(), phase, _number(report.duration),
                      outcome, _CPU(), usage.ru_maxrss,
                  ])

              def pytest_runtest_logfinish(self, nodeid, location):
                  if self.role != "controller" and self.current is not None:
                      self.emit(["f", self.current[1], _NOW(), _CPU()])
                      self.current = None

              def pytest_sessionfinish(self, session, exitstatus):
                  self.emit(["end", _NOW(), int(exitstatus), _CPU()])

              def pytest_unconfigure(self, config):
                  if self.fd is not None:
                      _CLOSE(self.fd)
                      self.fd = None


          def pytest_configure(config):
              directory_text = os.environ.get("Q1775_OBSERVER_DIR")
              root_text = os.environ.get("Q1775_OBSERVER_ROOT")
              if not directory_text or not root_text or config.rootpath.resolve() != Path(root_text).resolve():
                  return
              directory = Path(directory_text)
              if directory.is_symlink() or not directory.is_dir():
                  raise pytest.UsageError("q1775 observation directory is invalid")
              worker = getattr(config, "workerinput", None)
              if worker is not None:
                  if worker.get("q1775_observation") is not True:
                      return
                  role = worker.get("workerid")
                  if role not in ("gw0", "gw1"):
                      raise pytest.UsageError("q1775 observation requires the unchanged two-worker policy")
              else:
                  try:
                      owner = os.open(
                          directory / "owner", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600
                      )
                  except FileExistsError:
                      return
                  os.close(owner)
                  role = "controller" if config.getoption("numprocesses", default=0) else "serial"
              config.pluginmanager.register(Observer(directory, role), "q1775-observation")
          PYOBSERVER
          uv run --no-sync python - <<'PYMETA'
          import hashlib
          from importlib.metadata import distributions
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import time

          root = Path.cwd()
          base = Path(os.environ['RUNNER_TEMP']) / 'n1-focused'
          resources = {}
          for name in ('cpu.max', 'memory.max', 'memory.current', 'cpuset.cpus.effective'):
              path = Path('/sys/fs/cgroup') / name
              resources[name] = path.read_text()[:4096] if path.is_file() else None
          selected = Path(sys.executable).resolve()
          kind = 'system' if selected == Path('/usr/bin/python3.12').resolve() else 'managed'
          assert kind == os.environ['EXPECTED_PROVIDER'], (kind, os.environ['EXPECTED_PROVIDER'])
          record = {
              'source_head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'lock_sha256': hashlib.sha256((root / 'uv.lock').read_bytes()).hexdigest(),
              'module_sha256': hashlib.sha256((root / 'tests/scripts/test_live_system_profile_activation_source.py').read_bytes()).hexdigest(),
              'observer_sha256': hashlib.sha256((base / 'q1775_ci_observer.py').read_bytes()).hexdigest(),
              'version': sys.version, 'compiler': platform.python_compiler(),
              'implementation': platform.python_implementation(), 'provider': kind,
              'machine': platform.machine(), 'system': platform.system(), 'release': platform.release(),
              'cpus': os.cpu_count(), 'affinity': len(os.sched_getaffinity(0)) if hasattr(os, 'sched_getaffinity') else None,
              'load': list(os.getloadavg()), 'cgroup': resources,
              'clock': str(time.get_clock_info('perf_counter')),
              'packages': sorted((d.metadata['Name'], d.version) for d in distributions()),
              'scope': 'full-suite worker diagnostic; production runner and deadlines unchanged; not PR qualification',
          }
          (base / 'metadata.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps({k: record[k] for k in ('version', 'provider', 'machine', 'cpus', 'affinity', 'cgroup')}))
          PYMETA
      - name: Observe canonical bounded full test run
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/n1-focused"
          export PYTEST_PLUGINS=q1775_ci_observer
          export PYTHONPATH="$base"
          export Q1775_OBSERVER_DIR="$base"
          export Q1775_OBSERVER_ROOT="$GITHUB_WORKSPACE"
          export HMCPCTL_TEST_TIMINGS=1
          printf 'begin=%s\n' "$(date -u +%FT%TZ)" > "$base/boundary.txt"
          set +e
          /usr/bin/time -v -o "$base/resources.txt" just test > "$base/pytest.log" 2>&1
          result=$?
          set -e
          printf 'end=%s exit=%s\n' "$(date -u +%FT%TZ)" "$result" >> "$base/boundary.txt"
          cat "$base/boundary.txt"
          exit "$result"
      - name: Retain bounded parameter-free journals on every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: full-worker-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/n1-focused/metadata.json
            ${{ runner.temp }}/n1-focused/events/*.jsonl
            ${{ runner.temp }}/n1-focused/boundary.txt
            ${{ runner.temp }}/n1-focused/resources.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
